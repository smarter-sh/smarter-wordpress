version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    labels:
      - "dependencies"
      - "php"
      - "automated pr"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
    assignees:
      - "lpm0073"
    reviewers:
      - "lpm0073"
  - package-ecosystem: "npm"
    directory: "/"
    labels:
      - "dependencies"
      - "javascript"
      - "automated pr"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
    ignore:
      # Version 10 needs conventional-changelog-writer 9, but the stable
      # @semantic-release/release-notes-generator (14.x) still installs writer 8,
      # and the release fails with "Missing helper". Lift this when
      # release-notes-generator 15 is stable.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
    assignees:
      - "lpm0073"
    reviewers:
      - "lpm0073"
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "automated pr"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
    assignees:
      - "lpm0073"
    reviewers:
      - "lpm0073"
